services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: command-center-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - command-center-network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: command-center-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=Central Software Command Center
      - SECRET_KEY=${SECRET_KEY:-command-center-super-secure-production-secret-key-389104810283}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-commandcenter}:${POSTGRES_PASSWORD:-ChangeMeSecurePass123}@postgres:5432/${POSTGRES_DB:-commandcenter}
      - REDIS_URL=redis://redis:6379/0
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - SEED_DEMO_DATA=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8000/api/health || python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - command-center-network

  postgres:
    image: postgres:16-alpine
    container_name: command-center-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commandcenter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePass123}
      POSTGRES_DB: ${POSTGRES_DB:-commandcenter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commandcenter} -d ${POSTGRES_DB:-commandcenter}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - command-center-network

  redis:
    image: redis:7-alpine
    container_name: command-center-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - command-center-network

  monitoring-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    container_name: command-center-agent
    restart: unless-stopped
    environment:
      - COMMAND_CENTER_URL=http://backend:8000
      - AGENT_API_TOKEN=cc_live_demo_agent_key
      - SERVER_ID=VPS-01
      - INTERVAL_SECONDS=60
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - command-center-network

networks:
  command-center-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
