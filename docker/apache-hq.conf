# ==============================================================================
# Apache2 Reverse Proxy Virtual Host Configuration for hq.kkdes.co.ke
# Central Software Command Center
# ==============================================================================

<VirtualHost *:80>
    ServerName hq.kkdes.co.ke
    ServerAdmin admin@kkdes.co.ke

    RewriteEngine On

    # Real-time WebSocket Hub Proxy for /ws
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://127.0.0.1:8088/$1 [P,L]

    ProxyPreserveHost On
    ProxyPass /ws ws://127.0.0.1:8088/ws
    ProxyPassReverse /ws ws://127.0.0.1:8088/ws

    # REST APIs & Web Frontend
    ProxyPass / http://127.0.0.1:8088/
    ProxyPassReverse / http://127.0.0.1:8088/

    # Forwarded Protocol headers
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    RequestHeader set X-Forwarded-Port expr=%{SERVER_PORT}

    ErrorLog ${APACHE_LOG_DIR}/hq_error.log
    CustomLog ${APACHE_LOG_DIR}/hq_access.log combined
</VirtualHost>
